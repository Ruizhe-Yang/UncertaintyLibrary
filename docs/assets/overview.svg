<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">UncertaintyLibrary</title>
<desc id="desc">A closed interval or finite candidate set defines selected input settings. The caller runs model responses and analyses sensitivity or sampled extrema. This is deterministic analysis; selected cases do not establish a global bound.</desc>
